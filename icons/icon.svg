<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background com bordas arredondadas padrão App Icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Caderno de Fiado Base -->
  <g filter="url(#glow)">
    <!-- Capa do Caderno -->
    <rect x="110" y="96" width="292" height="320" rx="24" fill="#1e293b" stroke="#334155" stroke-width="6"/>
    
    <!-- Lombada / Espiral lateral -->
    <rect x="110" y="96" width="48" height="320" rx="16" fill="url(#emeraldGrad)"/>
    
    <!-- Anéis espirais -->
    <circle cx="134" cy="140" r="10" fill="#090d16" stroke="#34d399" stroke-width="4"/>
    <circle cx="134" cy="200" r="10" fill="#090d16" stroke="#34d399" stroke-width="4"/>
    <circle cx="134" cy="260" r="10" fill="#090d16" stroke="#34d399" stroke-width="4"/>
    <circle cx="134" cy="320" r="10" fill="#090d16" stroke="#34d399" stroke-width="4"/>
    <circle cx="134" cy="380" r="10" fill="#090d16" stroke="#34d399" stroke-width="4"/>

    <!-- Linhas de Registro Financeiro -->
    <rect x="186" y="145" width="180" height="12" rx="6" fill="#334155"/>
    <rect x="186" y="175" width="130" height="10" rx="5" fill="#10b981" fill-opacity="0.8"/>
    
    <rect x="186" y="215" width="180" height="12" rx="6" fill="#334155"/>
    <rect x="186" y="245" width="145" height="10" rx="5" fill="#10b981" fill-opacity="0.8"/>

    <rect x="186" y="285" width="180" height="12" rx="6" fill="#334155"/>
    <rect x="186" y="315" width="110" height="10" rx="5" fill="#f59e0b" fill-opacity="0.9"/>

    <!-- Ícone de Raio / Zap de Cobrança em Destaque -->
    <path d="M330 250 L275 345 L310 345 L270 425 L365 315 L320 315 Z" fill="url(#goldGrad)" stroke="#090d16" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Cifrão R$ Estilizado -->
    <circle cx="350" cy="150" r="32" fill="url(#emeraldGrad)"/>
    <text x="350" y="162" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">$</text>
  </g>
</svg>
