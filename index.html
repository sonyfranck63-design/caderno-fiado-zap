  <!-- Captura e Tratamento Elegante de Redirecionamento OAuth Google Drive -->
  <script>
    (function() {
      try {
        var hash = window.location.hash || '';
        if (hash.indexOf('access_token=') !== -1) {
          var match = hash.match(/access_token=([^&]+)/);
          if (match && match[1]) {
            var token = decodeURIComponent(match[1]);
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(token).catch(function() {});
            }
            window.addEventListener('DOMContentLoaded', function() {
              var overlay = document.createElement('div');
              overlay.id = 'oauth-success-overlay';
              overlay.style.cssText = 'position:fixed;inset:0;background:#090d16;color:#fff;z-index:9999999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:sans-serif;';
              overlay.innerHTML = 
                '<div style="width:84px;height:84px;border-radius:26px;background:linear-gradient(135deg,#059669,#10b981);display:flex;align-items:center;justify-content:center;margin-bottom:20px;box-shadow:0 12px 30px rgba(16,185,129,0.4);">' +
                  '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' +
                '</div>' +
                '<h2 style="font-size:22px;font-weight:800;margin-bottom:8px;color:#fff;">Google Drive Autorizado!</h2>' +
                '<p style="font-size:13px;color:#94a3b8;margin-bottom:20px;max-width:320px;line-height:1.5;">Sua autorização foi concluída com sucesso no Google. A chave de acesso já foi copiada.</p>' +
                '<button id="btn-return-app" style="width:100%;max-width:320px;padding:15px;background:#10b981;color:#fff;border:none;border-radius:16px;font-size:14px;font-weight:700;margin-bottom:12px;cursor:pointer;box-shadow:0 4px 14px rgba(16,185,129,0.3);">' +
                  '📱 VOLTAR AO APLICATIVO' +
                '</button>' +
                '<p id="copy-status" style="font-size:12px;color:#10b981;font-weight:600;">✓ Chave copiada! Basta retornar ao app</p>';
              document.body.appendChild(overlay);

              var btn = document.getElementById('btn-return-app');
              if (btn) {
                btn.onclick = function() {
                  if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(token).catch(function() {});
                  }
                  try {
                    window.location.href = 'intent://#Intent;package=net.mikespub.mywebview;scheme=mywebview;end;';
                  } catch(e) {}
                  setTimeout(function() {
                    window.close();
                  }, 600);
                };
              }
            });
          }
        }
      } catch (e) {}
    })();
  </script>

  <!-- Capturador de Erros de Diagnóstico (Ativo apenas em desenvolvimento ou com ?debug=true) -->
  <script>
    window.__appErrors = [];
    var isDebugMode = window.location.search.indexOf('debug=true') !== -1 ||
                      localStorage.getItem('cadernofiado_debug') === 'true';
    window.__CADERNO_DEBUG__ = isDebugMode;

    window.onerror = function(msg, url, line, col, error) {
      var err = "Erro JS: " + msg + " (" + url + ":" + line + ":" + col + ")";
      window.__appErrors.push(err);
      console.error("[CadernoFiado]", err, error);
      if (isDebugMode) {
        var el = document.getElementById('debug-error');
        if (el) {
          el.style.display = 'block';
          el.innerText += '\n' + err + (error && error.stack ? '\n' + error.stack : '');
        }
      }
      return false;
    };
    window.onunhandledrejection = function(e) {
      var err = "Promise rejeitada: " + (e.reason && e.reason.stack ? e.reason.stack : e.reason);
      window.__appErrors.push(err);
      console.error("[CadernoFiado]", err, e.reason);
      if (isDebugMode) {
        var el = document.getElementById('debug-error');
        if (el) {
          el.style.display = 'block';
          el.innerText += '\n' + err;
        }
      }
    };
  </script>

  <!-- Gerenciamento de Cache & Service Worker -->
  <script>
    (function() {
      var isNativeApp = window.androidAppProxy !== undefined || 
                        navigator.userAgent.indexOf('wv') !== -1 ||
                        window.location.protocol === 'file:';

      if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
        if (isNativeApp) {
          try {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function() {});
          } catch(e) {}
          if ('caches' in window) {
            try {
              caches.keys().then(function(names) {
                for (var j = 0; j < names.length; j++) {
                  caches.delete(names[j]);
                }
              }).catch(function() {});
            } catch(e) {}
          }
        } else {
          // No navegador Web (PWA), registra e atualiza
          window.addEventListener('load', function() {
            try {
              navigator.serviceWorker.register('./sw.js?v=2.1.0', { scope: './' })
                .then(function(reg) {
                  reg.update();
                  console.log('[PWA] Service Worker ativo:', reg.scope);
                })
                .catch(function(err) {});
            } catch(e) {}
          });
        }
      }
    })();
  </script>

  <script>
    // Captura de evento de instalação PWA (beforeinstallprompt)
    window.__deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.__deferredInstallPrompt = e;
      if (typeof window.__onPwaInstallAvailable === 'function') {
        window.__onPwaInstallAvailable();
      }
    });

    window.addEventListener('appinstalled', function() {
      console.log('[PWA] Aplicativo instalado com sucesso na tela inicial!');
      window.__deferredInstallPrompt = null;
    });

    // Watchdog de Inicialização: Se após 3.5 segundos o #root estiver vazio ou se houver erro crítico,
    // apresenta interface amigável de recuperação em vez de tela preta silenciosa.
    setTimeout(function() {
      var rootEl = document.getElementById('root');
      if (rootEl && (!rootEl.firstElementChild || rootEl.children.length === 0)) {
        var errDiv = document.getElementById('debug-error');
        if (errDiv) {
          errDiv.style.display = 'block';
          var hasErrors = window.__appErrors && window.__appErrors.length > 0;
          errDiv.innerHTML = '<div style="font-family:sans-serif;padding:8px;">' +
            '<div style="font-weight:700;font-size:15px;margin-bottom:6px;">⚠️ Carregando o CadernoFiado...</div>' +
            (hasErrors 
              ? window.__appErrors.map(function(e){ return '<div style="font-size:12px;opacity:0.9;margin-bottom:4px;font-family:monospace;">' + e + '</div>'; }).join('')
              : '<div style="font-size:13px;opacity:0.9;margin-bottom:8px;">O aplicativo está demorando mais que o esperado para iniciar.</div>') +
            '<div style="margin-top:12px;display:flex;gap:8px;">' +
              '<button onclick="location.reload();" style="background:#22c55e;color:#fff;border:none;padding:8px 16px;border-radius:10px;font-weight:bold;cursor:pointer;">Recarregar</button>' +
              '<button onclick="localStorage.clear();location.reload();" style="background:#374151;color:#fff;border:none;padding:8px 16px;border-radius:10px;font-weight:bold;cursor:pointer;">Restaurar Padrões</button>' +
            '</div>' +
          '</div>';
        }
      }
    }, 3500);
  </script>
