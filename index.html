<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('cf_theme');
        if (theme === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch(e) {}
    })();
  </script>
  <title>CadernoFiado & Cobrança Zap - Gestão de Fiados, Cobrança WhatsApp e PIX</title>
  
  <!-- Meta tags SEO & PWA -->
  <meta name="description" content="Aplicativo prático para autônomos, manicures e pequenos comerciantes gerenciarem vendas fiadas, cobranças no WhatsApp e PIX com recibos em PDF.">
  <meta name="theme-color" content="#0b0f19">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CadernoFiado">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Silenciador de avisos de console de bibliotecas standalone -->
  <script>
    (function() {
      var _w = console.warn;
      console.warn = function() {
        if (arguments[0] && typeof arguments[0] === 'string') {
          if (arguments[0].indexOf('tailwindcss.com') !== -1 || arguments[0].indexOf('Babel transformer') !== -1) {
            return;
          }
        }
        _w.apply(console, arguments);
      };
    })();
  </script>

  <!-- Tailwind CSS Local (Offline) -->
  <script src="vendor/tailwindcss.js"></script>
  <script>
    tailwind.config = {

      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e', // Verde comercial vivo
              600: '#16a34a', // Verde WhatsApp / Dinheiro
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
              950: '#052e16',
            },
            fintech: {
              dark: '#0b0f19',
              card: '#0f172a',
              cardLight: '#1e293b',
              border: '#1e293b',
            },
            gold: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
            }
          },
          boxShadow: {
            'glow-gold': '0 0 20px -5px rgba(245, 158, 11, 0.3)',
          }
        }
      }
    };
  </script>

  <!-- Capturador de Erros de Diagnóstico (Ativo apenas em desenvolvimento ou com ?debug=true) -->
  <script>
    window.__appErrors = [];
    var isDebugMode = window.location.search.indexOf('debug=true') !== -1 ||
                      localStorage.getItem('cadernofiado_debug') === 'true';
    window.__CADERNO_DEBUG__ = isDebugMode;

    window.onerror = function(msg, url, line, col, error) {
      var err = "Erro JS: " + msg + " (" + url + ":" + line + ":" + col + ")";
      window.__appErrors.push(err);
      console.error("[CadernoFiado]", err, error);
      if (isDebugMode) {
        var el = document.getElementById('debug-error');
        if (el) {
          el.style.display = 'block';
          el.innerText += '\n' + err + (error && error.stack ? '\n' + error.stack : '');
        }
      }
      return false;
    };
    window.onunhandledrejection = function(e) {
      var err = "Promise rejeitada: " + (e.reason && e.reason.stack ? e.reason.stack : e.reason);
      window.__appErrors.push(err);
      console.error("[CadernoFiado]", err, e.reason);
      if (isDebugMode) {
        var el = document.getElementById('debug-error');
        if (el) {
          el.style.display = 'block';
          el.innerText += '\n' + err;
        }
      }
    };
  </script>

  <!-- Bibliotecas Locais (100% Offline / Standalone para Mobile e Web) -->
  <!-- React 18 & ReactDOM -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <!-- Babel Standalone para transpilação JSX -->
  <script src="vendor/babel.min.js"></script>
  <!-- QRCode.js para geração de QR Code de PIX sem API externa -->
  <script src="vendor/qrcode.min.js"></script>
  <!-- jsPDF para emissão de Recibos e Extratos timbrados profissionais -->
  <script src="vendor/jspdf.umd.min.js"></script>

  <!-- Estilos Globais -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen font-sans selection:bg-brand-500 selection:text-white transition-colors duration-200">
  <div id="debug-error" style="display:none; background:#7f1d1d; color:#fef2f2; padding:16px; font-family:monospace; white-space:pre-wrap; border-bottom:3px solid #ef4444; z-index:999999; position:relative;"></div>
  
  <!-- Root do App React -->
  <div id="root"></div>

  <!-- Script Unificado da Aplicação -->
  <script type="text/babel" src="js/bundle.js"></script>

  <!-- Registro do Service Worker & Suporte PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(function(reg) {
            console.log('[PWA] Service Worker registrado no escopo:', reg.scope);
          })
          .catch(function(err) {
            console.warn('[PWA] Falha ao registrar Service Worker:', err);
          });
      });
    }

    // Captura de evento de instalação PWA (beforeinstallprompt)
    window.__deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.__deferredInstallPrompt = e;
      if (typeof window.__onPwaInstallAvailable === 'function') {
        window.__onPwaInstallAvailable();
      }
    });

    window.addEventListener('appinstalled', function() {
      console.log('[PWA] Aplicativo instalado com sucesso na tela inicial!');
      window.__deferredInstallPrompt = null;
    });

    // Watchdog de Inicialização: Se após 3.5 segundos o #root estiver vazio ou se houver erro crítico,
    // apresenta interface amigável de recuperação em vez de tela preta silenciosa.
    setTimeout(function() {
      var rootEl = document.getElementById('root');
      if (rootEl && (!rootEl.firstElementChild || rootEl.children.length === 0)) {
        var errDiv = document.getElementById('debug-error');
        if (errDiv) {
          errDiv.style.display = 'block';
          var hasErrors = window.__appErrors && window.__appErrors.length > 0;
          errDiv.innerHTML = '<div style="font-family:sans-serif;padding:8px;">' +
            '<div style="font-weight:700;font-size:15px;margin-bottom:6px;">⚠️ Carregando o CadernoFiado...</div>' +
            (hasErrors 
              ? window.__appErrors.map(function(e){ return '<div style="font-size:12px;opacity:0.9;margin-bottom:4px;font-family:monospace;">' + e + '</div>'; }).join('')
              : '<div style="font-size:13px;opacity:0.9;margin-bottom:8px;">O aplicativo está demorando mais que o esperado para iniciar.</div>') +
            '<div style="margin-top:12px;display:flex;gap:8px;">' +
              '<button onclick="location.reload();" style="background:#22c55e;color:#fff;border:none;padding:8px 16px;border-radius:10px;font-weight:bold;cursor:pointer;">Recarregar</button>' +
              '<button onclick="localStorage.clear();location.reload();" style="background:#374151;color:#fff;border:none;padding:8px 16px;border-radius:10px;font-weight:bold;cursor:pointer;">Restaurar Padrões</button>' +
            '</div>' +
          '</div>';
        }
      }
    }, 3500);
  </script>
</body>
</html>
