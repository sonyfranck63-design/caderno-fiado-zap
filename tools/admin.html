<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Administrador — Gerador de Licenças CadernoFiado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="../vendor/tailwindcss.js"></script>
  <script>
    if (!window.tailwind) {
      document.write('<script src="https://cdn.tailwindcss.com"><\/script>');
    }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #0b0f19;
      color: #f1f5f9;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-8 flex items-center justify-center">

  <div class="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
    
    <!-- Cabeçalho -->
    <div class="border-b border-slate-800 pb-5 flex items-start justify-between gap-4">
      <div>
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold mb-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>Painel Administrativo</span>
        </div>
        <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight">Gerador de Licenças</h1>
        <p class="text-xs text-slate-400 mt-1">Geração de códigos de ativação compactos vinculados ao dispositivo do cliente.</p>
      </div>
      <div class="w-10 h-10 rounded-xl bg-slate-800 border border-slate-700 text-emerald-400 flex items-center justify-center flex-shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-1.5 1.5L16 7m-1.5 1.5L13 10m-1.5 1.5L10 13m-1.5 1.5L7 16m-1.5 1.5L4 19m-2 2h4l10.5-10.5a2.121 2.121 0 0 0 0-3l-1.5-1.5a2.121 2.121 0 0 0-3 0L1.5 16.5V21h4z"/><circle cx="16.5" cy="7.5" r=".5"/></svg>
      </div>
    </div>

    <!-- Formulário -->
    <form id="licenseForm" class="space-y-4">
      
      <!-- ID do Aparelho do Cliente -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">
          ID do Aparelho (enviado pelo lojista)
        </label>
        <input
          type="text"
          id="deviceId"
          required
          placeholder="Ex: CF-C5A6-6A19"
          class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700 text-white font-mono text-sm uppercase focus:outline-none focus:border-emerald-500 transition-colors"
        />
        <p class="text-[11px] text-slate-500 mt-1.5">O lojista localiza este código na aba "Plano VIP" do aplicativo.</p>
      </div>

      <!-- Tipo de Plano -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5 uppercase tracking-wider">
          Plano Contratado
        </label>
        <div class="grid grid-cols-3 gap-2.5">
          <label class="cursor-pointer">
            <input type="radio" name="planType" value="30D" class="peer sr-only" checked>
            <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 peer-checked:border-emerald-500 peer-checked:bg-emerald-500/10 text-center transition-all">
              <span class="block text-xs font-bold text-white">Mensal</span>
              <span class="block text-[11px] text-slate-400 mt-0.5">30 Dias</span>
            </div>
          </label>

          <label class="cursor-pointer">
            <input type="radio" name="planType" value="365D" class="peer sr-only">
            <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 peer-checked:border-emerald-500 peer-checked:bg-emerald-500/10 text-center transition-all">
              <span class="block text-xs font-bold text-white">Anual</span>
              <span class="block text-[11px] text-slate-400 mt-0.5">1 Ano</span>
            </div>
          </label>

          <label class="cursor-pointer">
            <input type="radio" name="planType" value="LIFETIME" class="peer sr-only">
            <div class="p-3 rounded-xl bg-slate-950 border border-slate-800 peer-checked:border-emerald-500 peer-checked:bg-emerald-500/10 text-center transition-all">
              <span class="block text-xs font-bold text-emerald-400">Vitalício</span>
              <span class="block text-[11px] text-slate-400 mt-0.5">Permanente</span>
            </div>
          </label>
        </div>
      </div>

      <!-- Botão Gerar -->
      <button
        type="submit"
        class="w-full py-3.5 px-4 rounded-xl bg-emerald-600 hover:bg-emerald-500 active:scale-[0.99] text-white font-bold text-sm flex items-center justify-center gap-2 transition-all shadow-md"
      >
        <span>Gerar Código de Ativação</span>
      </button>

    </form>

    <!-- Resultado Gerado -->
    <div id="resultSection" class="hidden space-y-4 pt-4 border-t border-slate-800">
      
      <div class="p-4 rounded-2xl bg-slate-950 border border-emerald-500/30 space-y-3">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider flex items-center gap-1.5">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
            Código Gerado
          </span>
          <span id="planBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-800 text-slate-300"></span>
        </div>

        <div>
          <label class="text-[11px] text-slate-400 block mb-1">Código de Ativação do Cliente:</label>
          <div class="flex items-center gap-2">
            <input
              type="text"
              id="generatedKey"
              readonly
              class="w-full px-3 py-2 rounded-lg bg-slate-900 border border-slate-800 text-xs text-white font-mono select-all focus:outline-none"
            />
            <button
              id="btnCopyKey"
              type="button"
              class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 transition-colors flex-shrink-0"
            >
              Copiar
            </button>
          </div>
        </div>

        <div>
          <label class="text-[11px] text-slate-400 block mb-1">Mensagem Formatada para o WhatsApp:</label>
          <textarea
            id="whatsappMessage"
            rows="5"
            readonly
            class="w-full p-3 rounded-lg bg-slate-900 border border-slate-800 text-xs text-slate-300 font-sans focus:outline-none resize-none select-all"
          ></textarea>
        </div>

        <button
          id="btnCopyMessage"
          type="button"
          class="w-full py-2.5 px-3 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/30 text-emerald-300 font-bold text-xs flex items-center justify-center gap-1.5 transition-colors"
        >
          <span>📲 Copiar Mensagem Completa para o WhatsApp</span>
        </button>

      </div>

    </div>

    <!-- Chaves e Configurações de Segurança -->
    <div class="text-[11px] text-slate-500 pt-2 border-t border-slate-800 flex items-center justify-between">
      <span>Algoritmo: ECDSA NIST P-256 + SHA-256</span>
      <span class="text-emerald-500">Chave Privada Ativa</span>
    </div>

  </div>

  <script>
    // Chave Privada do Dono para assinatura de licenças
    const PRIVATE_KEY_JWK = {
      "kty": "EC",
      "crv": "P-256",
      "x": "sju7sWqTYzdwcft-dTY5W7roV1qv2yx3nIH-FyIt28M",
      "y": "rR6FBrA0W-I9CUhyd7ORtJTltMTUiwIWuoQUWKg86bY",
      "d": "GcbYAlZocw8LnFQChw5D0rOi74XSQSkdNgAwc3jGIro"
    };

    function toBase64Url(uint8Array) {
      let binary = '';
      for (let i = 0; i < uint8Array.length; i++) {
        binary += String.fromCharCode(uint8Array[i]);
      }
      return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function stringToBase64Url(str) {
      return toBase64Url(new TextEncoder().encode(str));
    }

    function formatDeviceId(val) {
      if (!val) return '';
      let clean = val.toString().toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (clean.startsWith('CF')) {
        clean = clean.slice(2);
      }
      if (clean.length === 8) {
        return `CF-${clean.slice(0, 4)}-${clean.slice(4, 8)}`;
      }
      return clean ? `CF-${clean}` : '';
    }

    async function generateSignedLicense(deviceId, planType) {
      const cleanId = formatDeviceId(deviceId);
      const now = Date.now();
      let expiresAt = null;
      let planName = 'Plano VIP Mensal (30 Dias)';

      if (planType === '30D') {
        expiresAt = now + 30 * 24 * 60 * 60 * 1000;
        planName = 'Plano VIP Mensal (30 Dias)';
      } else if (planType === '365D') {
        expiresAt = now + 365 * 24 * 60 * 60 * 1000;
        planName = 'Plano VIP Anual (1 Ano)';
      } else if (planType === 'LIFETIME') {
        expiresAt = 0;
        planName = 'Plano VIP Vitalício';
      }

      const payload = {
        d: cleanId,
        p: planType,
        e: expiresAt,
        t: now
      };

      const payloadStr = JSON.stringify(payload);
      const payloadB64 = stringToBase64Url(payloadStr);

      // Importa a chave privada ECDSA
      const privateKey = await window.crypto.subtle.importKey(
        "jwk",
        PRIVATE_KEY_JWK,
        { name: "ECDSA", namedCurve: "P-256" },
        false,
        ["sign"]
      );

      // Assina digitalmente o payload
      const signatureBuffer = await window.crypto.subtle.sign(
        { name: "ECDSA", hash: { name: "SHA-256" } },
        privateKey,
        new TextEncoder().encode(payloadB64)
      );

      const sigB64 = toBase64Url(new Uint8Array(signatureBuffer));
      const fullCode = `CFVIP.${payloadB64}.${sigB64}`;

      return {
        code: fullCode,
        planName,
        expiresAt,
        deviceId: cleanId
      };
    }

    const COMPACT_KEY_SALT = 'CFZAP_2026_COMPACT_KEY_SALT_B84';

    async function computeCompactChecksum(cleanDeviceId, plan) {
      const data = `${COMPACT_KEY_SALT}:${cleanDeviceId}:${plan}`;
      const hashBuf = await window.crypto.subtle.digest("SHA-256", new TextEncoder().encode(data));
      const hashArray = Array.from(new Uint8Array(hashBuf));
      const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
      return hashHex.substring(0, 6);
    }

    async function generateCompactLicense(deviceId, planType) {
      let cleanId = (deviceId || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/^CF/, '');
      if (cleanId.length < 8) {
        cleanId = cleanId.padEnd(8, '0');
      } else if (cleanId.length > 8) {
        cleanId = cleanId.substring(0, 8);
      }
      let planKey = 'L';
      let planName = 'Plano VIP Vitalício';
      if (planType === '30D') {
        planKey = 'M';
        planName = 'Plano VIP Mensal (30 Dias)';
      } else if (planType === '365D') {
        planKey = 'A';
        planName = 'Plano VIP Anual (1 Ano)';
      }
      const checksum = await computeCompactChecksum(cleanId, planKey);
      const part1 = cleanId.substring(0, 4);
      const part2 = cleanId.substring(4, 8);
      const compactCode = `VIP-${planKey}-${part1}-${part2}-${checksum}`;
      return {
        code: compactCode,
        planName,
        deviceId: cleanId
      };
    }

    // Manipulação do Formulário
    const form = document.getElementById('licenseForm');
    const resultSection = document.getElementById('resultSection');
    const deviceIdInput = document.getElementById('deviceId');
    const generatedKeyInput = document.getElementById('generatedKey');
    const whatsappMessage = document.getElementById('whatsappMessage');
    const planBadge = document.getElementById('planBadge');
    const btnCopyKey = document.getElementById('btnCopyKey');
    const btnCopyMessage = document.getElementById('btnCopyMessage');

    deviceIdInput.addEventListener('blur', () => {
      if (deviceIdInput.value.trim()) {
        deviceIdInput.value = formatDeviceId(deviceIdInput.value);
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      deviceIdInput.value = formatDeviceId(deviceIdInput.value);
      const deviceId = deviceIdInput.value;
      const planType = document.querySelector('input[name="planType"]:checked').value;

      try {
        const license = await generateCompactLicense(deviceId, planType);
        generatedKeyInput.value = license.code;
        planBadge.innerText = license.planName;

        const msg = `Olá! Seu acesso ao *${license.planName}* do CadernoFiado foi liberado.\n\nCódigo de Ativação:\n${license.code}\n\nComo ativar no celular:\n1. Abra o CadernoFiado\n2. Toque na aba inferior "Plano VIP"\n3. Digite ou cole o código acima e toque em "Ativar Código"\n\nPronto! Os recursos de cobrança com PIX e extrato em PDF já estão liberados. Boas vendas!`;
        
        whatsappMessage.value = msg;
        resultSection.classList.remove('hidden');
        resultSection.scrollIntoView({ behavior: 'smooth' });
      } catch (err) {
        alert('Erro ao gerar licença: ' + err.message);
      }
    });

    btnCopyKey.addEventListener('click', () => {
      navigator.clipboard.writeText(generatedKeyInput.value);
      btnCopyKey.innerText = 'Copiado!';
      setTimeout(() => btnCopyKey.innerText = 'Copiar', 2000);
    });

    btnCopyMessage.addEventListener('click', () => {
      navigator.clipboard.writeText(whatsappMessage.value);
      btnCopyMessage.innerHTML = '<span>Mensagem Copiada!</span>';
      setTimeout(() => {
        btnCopyMessage.innerHTML = '<span>Copiar Mensagem para WhatsApp</span>';
      }, 2000);
    });
  </script>

</body>
</html>
