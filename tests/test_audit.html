<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Suite de Testes Automatizados - CadernoFiado Zap</title>
  <script src="../vendor/react.production.min.js"></script>
  <script src="../vendor/react-dom.production.min.js"></script>
  <script src="../vendor/babel.min.js"></script>
  <script src="../vendor/qrcode.min.js"></script>
  <script src="../vendor/jspdf.umd.min.js"></script>
</head>
<body style="font-family: sans-serif; padding: 20px; background: #0f172a; color: #f8fafc;">
  <h1>Suite de Testes da Auditoria - CadernoFiado Zap</h1>
  <div id="results" style="white-space: pre-wrap; font-family: monospace; font-size: 13px; line-height: 1.6;"></div>

  <script src="../js/pix.js"></script>
  <script src="../js/pdf.js"></script>
  <script src="../js/state.js"></script>

  <script>
    window.onerror = function(msg, url, line, col, err) {
      const output = document.getElementById('results');
      if (output) output.innerHTML += `<div style="color:#ef4444">[FAIL] ERRO GLOBAL: ${msg} (${line}:${col})</div>`;
      console.error(msg, err);
      return false;
    };

    // Fixa o relógio para a data base de referência da auditoria (2026-09-16)
    // Garantindo que a suíte passe de forma 100% determinística em qualquer dia ou ano
    const FIXED_AUDIT_TIME = new Date('2026-09-16T12:00:00').getTime();
    let currentMockTime = FIXED_AUDIT_TIME;
    const OrigDate = window.Date;
    function MockDate(...args) {
      if (args.length === 0) return new OrigDate(currentMockTime);
      return new OrigDate(...args);
    }
    MockDate.prototype = OrigDate.prototype;
    MockDate.now = function() { return currentMockTime; };
    MockDate.parse = OrigDate.parse;
    MockDate.UTC = OrigDate.UTC;
    window.Date = MockDate;

    (async function runAllTests() {
      const output = document.getElementById('results');
      function log(msg, pass = null) {
        let color = '#94a3b8';
        let prefix = '[-] ';
        if (pass === true) { color = '#22c55e'; prefix = '[PASS] '; }
        if (pass === false) { color = '#ef4444'; prefix = '[FAIL] '; }
        output.innerHTML += `<div style="color:${color}">${prefix}${msg}</div>`;
        console.log(prefix + msg);
      }

      let totalTests = 0;
      let passedTests = 0;

      function assert(desc, condition) {
        totalTests++;
        if (condition) {
          passedTests++;
          log(desc, true);
        } else {
          log(desc + ' - FALHOU!', false);
        }
      }

      log("INICIANDO TESTES DOS 10 CENÁRIOS DA AUDITORIA...");

      try {
        // Limpar localStorage para ambiente isolado
        localStorage.clear();
        window.AppState.resetAll();

        // Setup de Clientes
        const c1 = window.AppState.addClient({ name: 'Cliente Teste 1', phone: '11988887777', creditLimit: 1000 });
        const c2 = window.AppState.addClient({ name: 'Cliente Teste 2', phone: '11977776666', creditLimit: 1000 });

      // ==========================================
      // Cenário 1: Venda à vista (1 parcela / fiado à vista)
      // ==========================================
      log("\n--- Cenário 1: Venda à vista (1 parcela) ---");
      const s1 = window.AppState.addInstallmentSale(c1.id, {
        description: 'Blusa de Lã',
        amount: 50.00,
        installments: 1,
        startDate: '2026-09-16'
      });
      let client1 = window.AppState.getClient(c1.id);
      let balance1 = window.AppState.computeBalance(client1);
      assert("Cenário 1.1: Saldo total do cliente é R$ 50.00", Math.abs(balance1 - 50.00) < 0.001);
      
      let s1Detail = window.AppState.getInstallmentDetails(client1, client1.transactions[0]);
      assert("Cenário 1.2: Parcela 1/1 identificada com valor R$ 50.00", s1Detail.remainingAmount === 50 && s1Detail.isInstallment === false);
      assert("Cenário 1.3: Status em_aberto", s1Detail.status === 'em_aberto');

      // ==========================================
      // Cenário 2: Venda parcelada em 2 vezes
      // ==========================================
      log("\n--- Cenário 2: Venda parcelada em 2 vezes (R$ 50.00) ---");
      window.AppState.addInstallmentSale(c1.id, {
        description: 'Calça Jeans',
        amount: 50.00,
        installments: 2,
        startDate: '2026-09-16'
      });
      client1 = window.AppState.getClient(c1.id);
      const jeansSales = client1.transactions.filter(t => t.type === 'sale' && t.description.includes('Calça Jeans'));
      assert("Cenário 2.1: Criou 2 parcelas para Calça Jeans", jeansSales.length === 2);
      assert("Cenário 2.2: Cada parcela é R$ 25.00", jeansSales[0].amount === 25 && jeansSales[1].amount === 25);
      
      const p1Due = jeansSales[0].dueDate; // 2026-09-16
      const p2Due = jeansSales[1].dueDate; // 2026-10-16
      assert("Cenário 2.3: Vencimento preserva mesmo dia no mês seguinte (16/09 e 16/10)", p1Due === '2026-09-16' && p2Due === '2026-10-16');

      // ==========================================
      // Cenário 3: Venda de R$ 100 em 3 parcelas (divisão de centavos)
      // ==========================================
      log("\n--- Cenário 3: Venda de R$ 100 em 3 parcelas ---");
      window.AppState.addInstallmentSale(c1.id, {
        description: 'Tênis Esportivo',
        amount: 100.00,
        installments: 3,
        startDate: '2026-09-16'
      });
      client1 = window.AppState.getClient(c1.id);
      const tenisSales = client1.transactions.filter(t => t.type === 'sale' && t.description.includes('Tênis Esportivo'));
      assert("Cenário 3.1: Criou exatamente 3 parcelas", tenisSales.length === 3);
      const sumTenis = tenisSales.reduce((acc, s) => acc + s.amount, 0);
      assert("Cenário 3.2: Soma exata das parcelas é R$ 100.00 (sem perda de centavos)", Math.abs(sumTenis - 100.00) < 0.001);
      assert("Cenário 3.3: Parcelas distribuídas corretamente (33.33, 33.33, 33.34)", 
        tenisSales[0].amount === 33.33 && tenisSales[1].amount === 33.33 && tenisSales[2].amount === 33.34);

      // ==========================================
      // Cenário 4: Venda parcelada em 6 vezes
      // ==========================================
      log("\n--- Cenário 4: Venda parcelada em 6 vezes (R$ 100.00) ---");
      window.AppState.addInstallmentSale(c1.id, {
        description: 'Kit Perfumaria',
        amount: 100.00,
        installments: 6,
        startDate: '2026-09-16'
      });
      client1 = window.AppState.getClient(c1.id);
      const kitSales = client1.transactions.filter(t => t.type === 'sale' && t.description.includes('Kit Perfumaria'));
      assert("Cenário 4.1: Criou 6 parcelas", kitSales.length === 6);
      const sumKit = kitSales.reduce((acc, s) => acc + s.amount, 0);
      assert("Cenário 4.2: Soma exata das 6 parcelas é R$ 100.00", Math.abs(sumKit - 100.00) < 0.001);

      // ==========================================
      // Cenário 5: Cobrança de parcela individual (detalhes isolados)
      // ==========================================
      log("\n--- Cenário 5: Cobrança de parcela individual ---");
      const inst1Tenis = tenisSales[0];
      const inst1Detail = window.AppState.getInstallmentDetails(client1, inst1Tenis);
      assert("Cenário 5.1: Parcela atual é 1 e total é 3", inst1Detail.current === 1 && inst1Detail.total === 3);
      assert("Cenário 5.2: Descrição limpa do produto sem prefixo [1/3]", inst1Detail.baseDescription === 'Tênis Esportivo');
      assert("Cenário 5.3: Valor da parcela individual é R$ 33.33 (não a dívida total)", inst1Detail.remainingAmount === 33.33);

      // ==========================================
      // Cenário 6: Cobrança com pagamento parcial de parcela
      // ==========================================
      log("\n--- Cenário 6: Pagamento parcial de parcela específica ---");
      // Abater R$ 13.33 na parcela 1 do Tênis
      window.AppState.addPayment(c1.id, {
        amount: 13.33,
        paymentMethod: 'PIX',
        notes: 'Entrada parcial',
        targetSaleId: inst1Tenis.id
      });
      client1 = window.AppState.getClient(c1.id);
      const inst1AfterPay = window.AppState.getInstallmentDetails(client1, inst1Tenis);
      assert("Cenário 6.1: Saldo restante da parcela 1 é exatamente R$ 20.00", Math.abs(inst1AfterPay.remainingAmount - 20.00) < 0.001);
      assert("Cenário 6.2: Status da parcela mudou para 'parcial'", inst1AfterPay.status === 'parcial');
      assert("Cenário 6.3: Valor pago registrado como R$ 13.33", Math.abs(inst1AfterPay.paidAmount - 13.33) < 0.001);

      // ==========================================
      // Cenário 7: Cobrança de parcela já quitada
      // ==========================================
      log("\n--- Cenário 7: Quitação de parcela e status 'quitada' ---");
      // Pagar os R$ 20 restantes da parcela 1 do Tênis
      window.AppState.addPayment(c1.id, {
        amount: 20.00,
        paymentMethod: 'Dinheiro',
        notes: 'Restante da parcela 1',
        targetSaleId: inst1Tenis.id
      });
      client1 = window.AppState.getClient(c1.id);
      const inst1Quitada = window.AppState.getInstallmentDetails(client1, inst1Tenis);
      assert("Cenário 7.1: Parcela 1 agora tem saldo restante R$ 0.00", inst1Quitada.remainingAmount === 0);
      assert("Cenário 7.2: Status é 'quitada'", inst1Quitada.status === 'quitada');

      // ==========================================
      // Cenário 8: Baixa de pagamento avulso (ordem cronológica FIFO)
      // ==========================================
      log("\n--- Cenário 8: Pagamento avulso FIFO ---");
      window.AppState.addPayment(c1.id, {
        amount: 30.00,
        paymentMethod: 'Dinheiro',
        notes: 'Pagamento avulso'
      });
      client1 = window.AppState.getClient(c1.id);
      const blusaSale = client1.transactions.find(t => t.type === 'sale' && t.description === 'Blusa de Lã');
      const blusaDetails = window.AppState.getInstallmentDetails(client1, blusaSale);
      assert("Cenário 8.1: Blusa de Lã recebeu os R$ 30 e tem saldo restante R$ 20.00", Math.abs(blusaDetails.remainingAmount - 20.00) < 0.001);
      assert("Cenário 8.2: Status da Blusa é 'parcial'", blusaDetails.status === 'parcial');

      // ==========================================
      // Cenário 9: Baixa de pagamento vinculado a parcela específica
      // ==========================================
      log("\n--- Cenário 9: Pagamento vinculado a parcela específica (targetSaleId) ---");
      const inst2Tenis = tenisSales[1];
      window.AppState.addPayment(c1.id, {
        amount: 33.33,
        paymentMethod: 'PIX',
        targetSaleId: inst2Tenis.id
      });
      client1 = window.AppState.getClient(c1.id);
      const inst2Details = window.AppState.getInstallmentDetails(client1, inst2Tenis);
      assert("Cenário 9.1: Parcela 2 do Tênis quitada diretamente por targetSaleId", inst2Details.status === 'quitada' && inst2Details.remainingAmount === 0);
      const blusaCheck = window.AppState.getInstallmentDetails(client1, blusaSale);
      assert("Cenário 9.2: Blusa continua com saldo restante R$ 20.00 intocada", Math.abs(blusaCheck.remainingAmount - 20.00) < 0.001);

      // ==========================================
      // Cenário 10: Isolamento de dados entre clientes
      // ==========================================
      log("\n--- Cenário 10: Isolamento total entre clientes ---");
      window.AppState.addInstallmentSale(c2.id, {
        description: 'Bolsa de Couro',
        amount: 150.00,
        installments: 1,
        startDate: '2026-09-16'
      });
      let client2 = window.AppState.getClient(c2.id);
      let balance2 = window.AppState.computeBalance(client2);
      assert("Cenário 10.1: Cliente 2 tem saldo isolado de R$ 150.00", Math.abs(balance2 - 150.00) < 0.001);
      
      window.AppState.addPayment(c2.id, { amount: 150.00, paymentMethod: 'Dinheiro' });
      client2 = window.AppState.getClient(c2.id);
      assert("Cenário 10.2: Cliente 2 quitou R$ 150.00 e tem saldo R$ 0.00", window.AppState.computeBalance(client2) === 0);
      
      client1 = window.AppState.getClient(c1.id);
      const actualBalance1 = window.AppState.computeBalance(client1);
      assert("Cenário 10.3: Saldo devedor do Cliente 1 permaneceu R$ 203.34 sem interferência", Math.abs(actualBalance1 - 203.34) < 0.01);

      // ==========================================
      // Teste Bônus: Validação e Restauração de Backup
      // ==========================================
      log("\n--- Teste Bônus: Validação e Restauração Segura de Backup ---");
      const backupJson = window.AppState.getBackupJsonString();
      const validation = window.AppState.validateBackup(backupJson);
      assert("Bônus 1: Validação de backup gerado é válida", validation.valid === true);
      assert("Bônus 2: Resumo identificou 2 clientes", validation.summary.clientsCount === 2);
      
      // ==========================================
      // Cenário 11: Proteção Anti-Time-Tampering e Expiração Estrita do Passe 24h
      // ==========================================
      log("\n--- Cenário 11: Passe 24h e Anti-Time-Tampering ---");
      const passExpires = window.AppState.activate24hPass();
      let vipInfo = window.AppState.getVipInfo();
      assert("Cenário 11.1: Passe 24h ativo concede status VIP", vipInfo.isVip === true && vipInfo.isPassActive === true);

      // Simulação de passe vencido
      localStorage.setItem('cadernofiado_rewarded_pass_v1', (Date.now() - 1000).toString());
      vipInfo = window.AppState.getVipInfo();
      assert("Cenário 11.2: Passe vencido bloqueia VIP imediatamente e limpa storage", vipInfo.isVip === false && localStorage.getItem('cadernofiado_rewarded_pass_v1') === null);

      // Simulação de atraso no relógio do aparelho (Anti-time-tampering)
      const futureStamp = Date.now() + 1000000;
      localStorage.setItem('cadernofiado_last_seen_time_v1', futureStamp.toString());
      localStorage.setItem('cadernofiado_rewarded_pass_v1', (futureStamp - 100).toString());
      vipInfo = window.AppState.getVipInfo();
      assert("Cenário 11.3: Anti-time-tampering detecta relógio atrasado e expira passe adulterado", vipInfo.isVip === false);

      // ==========================================
      // Cenário 12: PDF Service In-App Preview Handshake Seguro (Sem Crash no Android)
      // ==========================================
      log("\n--- Cenário 12: PDF In-App Preview Handshake Seguro ---");
      const previewRes = window.PdfService.openPdfPreview('blob:http://localhost:3000/test-blob');
      assert("Cenário 12.1: openPdfPreview bloqueia Intent nativa no Android e delega para visualizador interno", previewRes.success === false && previewRes.reason === 'use_internal_viewer');

      // ==========================================
      // Cenário 13: QR Code Resiliência com Fallback Seguro
      // ==========================================
      log("\n--- Cenário 13: QR Code Resiliência com Fallback Seguro ---");
      const testQrContainer = document.createElement('div');
      let qrError = false;
      try {
        window.PixService.renderQRCode(testQrContainer, '00020126360014BR.GOV.BCB.PIX011411999998888520400005303986540510.005802BR5909MERCADO6009SAOPAULO62070503***6304ABCD', 150);
      } catch(e) {
        qrError = true;
      }
      assert("Cenário 13.1: renderQRCode não lança exceção não tratada", qrError === false);
      // ==========================================
      // Cenário 14: Códigos de Ativação Compactos e Retrocompatibilidade
      // ==========================================
      log("\n--- Cenário 14: Licenciamento Compacto e Retrocompatibilidade ---");
      const currentDeviceId = window.AppState.getDeviceId();
      const compactMonthlyKey = await window.AppState.generateCompactLicenseKey(currentDeviceId, 'monthly');
      log("CHAVE GERADA: " + compactMonthlyKey);
      assert("Cenário 14.1: Chave compacta gerada tem formato VIP-M-XXXX-YYYY-ZZZZZZ", /^VIP-M-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-F0-9]{6}$/.test(compactMonthlyKey));
      
      const actCompactRes = await window.AppState.activateLicenseKey(compactMonthlyKey);
      assert("Cenário 14.2: Ativação com chave compacta válida tem sucesso", actCompactRes.success === true && (actCompactRes.planName || '').toLowerCase().includes('mensal'));
      
      const vipStatus = window.AppState.getVipInfo();
      assert("Cenário 14.3: AppState reconhece status VIP vitalício/mensal ativo", vipStatus.isVip === true && vipStatus.isLicensed === true);

      // Teste com checksum corrompido
      const corruptedKey = compactMonthlyKey.slice(0, -2) + '00';
      const actCorruptRes = await window.AppState.activateLicenseKey(corruptedKey);
      assert("Cenário 14.4: Chave compacta com checksum adulterado é rejeitada", actCorruptRes.success === false);

      // Teste para outro aparelho
      const otherDeviceKey = await window.AppState.generateCompactLicenseKey('DEV-9999-8888', 'yearly');
      const actOtherRes = await window.AppState.activateLicenseKey(otherDeviceKey);
      assert("Cenário 14.5: Chave gerada para outro DeviceId é rejeitada neste aparelho", actOtherRes.success === false);

      // Cenário 15: Validação de Integridade e Compilação do Bundle da Aplicação
      try {
        const bundleResp = await fetch('../js/bundle.js');

        if (bundleResp.ok) {
          const bundleCode = await bundleResp.text();
          let parseSuccess = false;
          let parseError = null;
          try {
            Babel.transform(bundleCode, { presets: ['react'] });
            parseSuccess = true;
          } catch (e) {
            parseError = e.message;
          }
          assert(`Cenário 15.1: bundle.js é transpilável pelo Babel sem erros de JSX/sintaxe (Tamanho: ${bundleCode.length} bytes)`, parseSuccess);
          if (!parseSuccess) {
            log(`Detalhe do erro de compilação do bundle.js: ${parseError}`, false);
          }
        }
      } catch (bundleErr) {
        log("Aviso: Não foi possível carregar bundle.js no teste: " + bundleErr.message);
      }

      // ==========================================
      // Cenário 16: Validação do BUG 3 — FIFO por Data de Criação (Imutável)
      // Cliente com venda A de R$ 100 totalmente paga -> adicionar venda B de R$ 50
      // com dueDate anterior ao de A -> venda A deve continuar "quitada" e venda B deve
      // aparecer "em aberto" (não o contrário).
      // ==========================================
      log("\n--- Cenário 16: Validação do BUG 3 (FIFO por Data de Criação) ---");
      const cFifo = window.AppState.addClient({ name: 'Cliente FIFO Teste', phone: '11999990000', creditLimit: 1000 });
      
      // 1. Cria venda A de R$ 100 com vencimento em 2026-10-15
      window.AppState.addSale(cFifo.id, {
        description: 'Venda A (Antiga)',
        amount: 100.00,
        dueDate: '2026-10-15'
      });

      // 2. Abate integralmente R$ 100 com pagamento genérico
      window.AppState.addPayment(cFifo.id, {
        amount: 100.00,
        paymentMethod: 'Dinheiro',
        notes: 'Pagamento total da Venda A'
      });

      let clientFifo = window.AppState.getClient(cFifo.id);
      let saleA = clientFifo.transactions.find(t => t.type === 'sale' && t.description.includes('Venda A'));
      let detailA1 = window.AppState.getInstallmentDetails(clientFifo, saleA);
      assert("Cenário 16.1: Venda A após pagamento de R$ 100 está 'quitada'", detailA1.status === 'quitada' && detailA1.remainingAmount === 0);

      // Simula passagem de tempo para garantir que a venda B tenha date cronologicamente posterior
      currentMockTime += 10000;

      // 3. Adiciona venda B de R$ 50 com dueDate '2026-09-25' (anterior ao dueDate da venda A '2026-10-15'!)
      window.AppState.addSale(cFifo.id, {
        description: 'Venda B (Nova com dueDate anterior)',
        amount: 50.00,
        dueDate: '2026-09-25'
      });

      clientFifo = window.AppState.getClient(cFifo.id);
      saleA = clientFifo.transactions.find(t => t.type === 'sale' && t.description.includes('Venda A'));
      let saleB = clientFifo.transactions.find(t => t.type === 'sale' && t.description.includes('Venda B'));

      let detailA2 = window.AppState.getInstallmentDetails(clientFifo, saleA);
      let detailB = window.AppState.getInstallmentDetails(clientFifo, saleB);

      assert("Cenário 16.2: Venda A continua 'quitada' após inclusão da Venda B", detailA2.status === 'quitada' && detailA2.remainingAmount === 0);
      assert("Cenário 16.3: Venda B aparece 'em_aberto' (saldo R$ 50.00)", detailB.status === 'em_aberto' && detailB.remainingAmount === 50.00);

      const balanceFifo = window.AppState.computeBalance(clientFifo);
      assert("Cenário 16.4: computeBalance reflete saldo devedor exato de R$ 50.00", Math.abs(balanceFifo - 50.00) < 0.001);

      // ==========================================
      // Cenário 17: Teste da Ponte Nativa Android (saveBase64File & shareBase64File)
      // ==========================================
      log("\n--- Cenário 17: Integração com Ponte Nativa Android ---");
      let mockSavedFile = null;
      let mockSharedFile = null;
      window.androidAppProxy = {
        saveBase64File: function(b64, fname, mime) {
          mockSavedFile = { b64, fname, mime };
          return true;
        },
        shareBase64File: function(b64, fname, mime, title, text) {
          mockSharedFile = { b64, fname, mime, title, text };
          return true;
        }
      };

      const testBlob = new Blob(['Conteúdo de teste PDF'], { type: 'application/pdf' });
      const dlResult = await window.PdfService.downloadPdf(testBlob, 'recibo_teste.pdf');
      assert("Cenário 17.1: downloadPdf aciona saveBase64File da ponte nativa com sucesso", dlResult.success === true && dlResult.method === 'native_bridge');
      assert("Cenário 17.2: Parâmetros corretos passados para saveBase64File", mockSavedFile && mockSavedFile.fname === 'recibo_teste.pdf' && mockSavedFile.mime === 'application/pdf');

      const shareResult = await window.PdfService.sharePdfFile(testBlob, 'acordo_teste.pdf', 'Acordo', 'Mensagem teste');
      assert("Cenário 17.3: sharePdfFile aciona shareBase64File da ponte nativa com sucesso", shareResult.success === true && shareResult.method === 'native_bridge');
      assert("Cenário 17.4: Parâmetros corretos passados para shareBase64File", mockSharedFile && mockSharedFile.fname === 'acordo_teste.pdf' && mockSharedFile.title === 'Acordo');

      const backupExp = await window.AppState.exportData();
      assert("Cenário 17.5: exportData utiliza shareBase64File no APK nativo", backupExp.success === true && backupExp.method === 'native_bridge');

      // Limpeza do mock
      delete window.androidAppProxy;

        log(`\n==========================================`);
        log(`RESULTADO FINAL: ${passedTests}/${totalTests} TESTES PASSARAM COM SUCESSO!`, passedTests === totalTests);
        log(`==========================================`);

        window.__TEST_RESULTS__ = {
          total: totalTests,
          passed: passedTests,
          success: totalTests === passedTests
        };
      } catch (err) {
        log("EXCEÇÃO INESPERADA NO TESTE: " + err.message + "\n" + err.stack, false);
      }
    })();
  </script>
</body>
</html>
